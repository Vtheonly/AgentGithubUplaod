# ============================================================================
# Supabase Project Configuration
# ============================================================================
# Docs: https://supabase.com/docs/reference/cli/config
#
# This file configures the local Supabase stack AND the production deployment.
# Run `supabase init` once locally, then `supabase db push` to apply migrations,
# `supabase functions deploy <name>` to deploy Edge Functions.
# ============================================================================

project_id = "el-imtiyaz"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
port = 54325
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
    "http://localhost:5173/auth/callback",
    "https://app.elimtiyaz.dz/auth/callback",
    "https://portal.elimtiyaz.dz/auth/callback"
]
jwt_expiry = 3600
refresh_token_rotation_enabled = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = true

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
template = {}
secure_password_change = true
max_frequency = "1s"

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = "https://api.elimtiyaz.dz/auth/v1/callback"

[auth.external.apple]
enabled = false

[auth.hooks]
# Hook to call our approval-workflow Edge Function on every new signup
send_confirmation = "approve-signup-request"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[functions.approve-signup-request]
verify_jwt = false

[functions.bind-activation-code]
verify_jwt = true

[functions.update-server-secret]
verify_jwt = true

[functions.collect-payment]
verify_jwt = true

[functions.refund-payment]
verify_jwt = true

[functions.run-overdue-scan]
verify_jwt = true
cron = "0 8 * * *"  # Daily at 08:00 UTC

[functions.expire-pending-approvals]
verify_jwt = false
cron = "0 0 * * *"  # Daily at midnight UTC

[functions.refresh-materialized-views]
verify_jwt = false
cron = "0 1 * * *"  # Daily at 01:00 UTC

[functions.purge-expired-backups]
verify_jwt = false
cron = "0 3 * * 0"  # Weekly Sunday at 03:00 UTC

[functions.ai-proxy]
verify_jwt = true

[functions.workflow-execute]
verify_jwt = true

[functions.generate-receipt-pdf]
verify_jwt = true

[functions.export-data]
verify_jwt = true

[analytics]
enabled = false
