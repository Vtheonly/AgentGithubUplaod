name: refund_pending_payment
description: |
  A parent has a tranche paid with an UNCLEARED check (status=pending).
  The parent bounces the check — refund the payment.
  The refund LIFO MUST subtract from `amountPending` (NOT `amountPaid`)
  because originalWasPending=true. If the implementation passes
  originalWasPending=false (the R5 bug), the revert is a silent no-op
  and amountPending stays inflated.
  This is the canonical test for the R5 fix.
given:
  ledger_entries:
    - id: led-charge-1
      tenant_id: "00000000-0000-0000-0000-000000000001"
      account_id: "parent:par-001:category:tuition:student:stu-001"
      parent_id: par-001
      student_id: stu-001
      category: tuition
      amount: 10000000
      type: charge
      source_type: installment
      source_id: ins-001
      method: null
      receipt_number: null
      payment_status: null
      reverses_id: null
      description: "Scolarité Tranche 1"
      actor_id: system
      actor_name: System
      at: "2026-09-15T00:00:00Z"
      metadata: { tranche: 1 }
    - id: led-pay-1
      tenant_id: "00000000-0000-0000-0000-000000000001"
      account_id: "parent:par-001:category:tuition:student:stu-001"
      parent_id: par-001
      student_id: stu-001
      category: tuition
      amount: -10000000
      type: payment
      source_type: payment
      source_id: pay-001
      method: check
      receipt_number: "REC-2026-000001"
      payment_status: pending   # uncleared!
      reverses_id: null
      description: "Chèque REC-2026-000001"
      actor_id: usr-001
      actor_name: "Agent comptoir"
      at: "2026-09-20T00:00:00Z"
      metadata: { }
  installments:
    - id: ins-001
      parent_id: par-001
      student_id: stu-001
      category: tuition
      label: "Tranche 1"
      amount_due: 10000000
      amount_paid: 0             # nothing cleared
      amount_pending: 10000000   # in the pending bucket
      due_date: "2026-09-15T00:00:00Z"
      status: pending_clearance
when:
  kind: refund_payment
  payment_id: pay-001
  reason: "Chèque sans provision"
  actor_id: usr-001
  actor_name: "Agent comptoir"
then:
  expected_account_balance:
    account_id: "parent:par-001:category:tuition:student:stu-001"
    balance: 10000000       # back to the charged amount
    total_charged: 10000000
    total_paid: 0           # payment reversed
    total_cleared: 0
    total_pending: 0        # CRITICAL: amountPending reverted to 0
    total_adjusted: 0
    total_refunded: 0
    unallocated_credit: 0
  expected_parent_summary:
    parent_id: par-001
    total_outstanding: 10000000
    total_overdue: 0
    total_charged: 10000000
    total_paid: 0
    total_cleared: 0
    total_pending: 0
    total_adjusted: 0
    total_refunded: 0
    total_unallocated_credit: 0
  expected_installments:
    - id: ins-001
      amount_paid: 0
      amount_pending: 0
      status: unpaid    # or 'pending' if the due date is in the future; here we're past due
