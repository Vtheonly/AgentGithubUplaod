name: unknown_category_does_not_crash
description: |
  A ledger entry with `category=parent_credit` and `payment_status=pending_clearance`
  is fed to the Android LedgerEntryEntity.toDomain() mapper.
  The previous PaymentCategory.fromCode and PaymentStatus.fromCode THROW on
  unknown codes; the R2 fix made them tolerant.
  This scenario feeds a row with the new categories and expects the conversion
  to succeed (no exception) — the canonical signal that pull sync will not
  crash when desktop-originated parent_credit rows arrive.
when:
  kind: parse_ledger_entry
  ledger_entry:
    id: led-pc-1
    tenant_id: "00000000-0000-0000-0000-000000000001"
    account_id: "parent:par-001:category:parent_credit"
    parent_id: par-001
    student_id: null
    category: parent_credit
    amount: -5000000
    type: adjustment
    source_type: adjustment
    source_id: pay-001
    method: null
    receipt_number: "REC-2026-000001"
    payment_status: null
    reverses_id: null
    description: "Crédit parent (trop-perçu)"
    actor_id: usr-001
    actor_name: "Agent comptoir"
    at: "2026-09-20T00:00:00Z"
    metadata: { reason: overpayment }
then:
  expected_parse_result:
    id: led-pc-1
    category_resolved: true        # boolean — did the enum resolve?
    category_code: parent_credit  # the wire code is preserved
    payment_status_resolved: true
    payment_status_code: null      # null because the input had null
