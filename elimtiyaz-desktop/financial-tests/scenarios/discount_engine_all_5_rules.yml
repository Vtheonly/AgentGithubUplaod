name: discount_engine_all_5_rules
description: |
  A student who qualifies for ALL 5 discount rules:
    - passage_palier: previous=5ap, current=1am → -10,000 DZD
    - sibling_fixed: childIndex=3 (2 additional siblings) → -10,000 DZD (2 × 5,000)
    - full_annual: paymentPlan=full_annual, payment before June 30 → -10% of gross
    - highest_average: previousRank=1 → -10% of gross
    - seniority_5y: enrollment 6+ years before academic year start → -5% of gross
  Gross = 330,000 DZD (33,000,000 centimes).
  Expected net = 330,000 - 10,000 - 10,000 - 33,000 - 33,000 - 16,500 = 227,500 DZD
  Tests R6 — the 5-rule discount engine.
when:
  kind: evaluate_discounts
  gross_tuition: 33000000    # 330,000 DZD
  previous_grade_level: "5ap"
  current_grade_level: "1am"
  child_index: 3
  payment_plan: full_annual
  payment_date: "2026-06-15T00:00:00Z"
  academic_year_start_year: 2026
  academic_year_start: "2026-09-15T00:00:00Z"
  enrollment_date: "2020-09-01T00:00:00Z"   # 6 years before academic year 2026
  previous_rank: 1
then:
  expected_discounts:
    - code: passage_palier
      amount: -1000000       # -10,000 DZD
    - code: sibling_fixed
      amount: -1000000       # -10,000 DZD (2 × 5,000)
    - code: full_annual
      amount: -3300000       # -10% of 330,000 = -33,000 DZD
    - code: highest_average
      amount: -3300000       # -10% of 330,000 = -33,000 DZD
    - code: seniority_5y
      amount: -1650000       # -5% of 330,000 = -16,500 DZD
  expected_total_discount: -10250000    # -102,500 DZD
  expected_net_tuition: 22750000        # 227,500 DZD
